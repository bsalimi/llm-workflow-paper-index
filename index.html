const form=document.querySelector('form'),input=document.querySelector('#password'),error=document.querySelector('#error'),gate=document.querySelector('#gate'),viewer=document.querySelector('#viewer'),frame=document.querySelector('#index'),button=document.querySelector('#unlock');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{
 event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Opening…';
 let value=input.value;
 try{
  if(!globalThis.crypto?.subtle)throw new Error('unsupported');
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
  frame.srcdoc=new TextDecoder('utf-8',{fatal:true}).decode(plaintext);
  input.value='';gate.hidden=true;viewer.hidden=false;document.querySelector('#lock').focus();
 }catch(e){error.textContent=e.message==='unsupported'?'Open this link in a current browser over HTTPS.':'That password did not open the index. Please try again.';input.value='';input.focus();}
 finally{value='';button.disabled=false;button.textContent='Open index';}
